<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 250px; padding: 12px; margin: 0; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    input, select, button { width: 100%; padding: 6px; margin-top: 6px; font-size: 12px; box-sizing: border-box; }
    #status { margin-top: 10px; font-size: 11px; color: #555; min-height: 16px; word-break: break-word; }
  </style>
</head>
<body>
  <h1>Caption Translator</h1>
  <input type="password" id="azureKeyInput" placeholder="Azure API Key" />
  <input type="text" id="azureRegionInput" placeholder="Region (e.g. eastus, global)" />
  <select id="langSelect">
    <option value="es">Spanish</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="ja">Japanese</option>
    <option value="ko">Korean</option>
    <option value="zh-Hans">Chinese (Simplified)</option>
    <option value="hi">Hindi</option>
    <option value="ar">Arabic</option>
    <option value="pt">Portuguese</option>
    <option value="ru">Russian</option>
  </select>
  <button id="translateBtn">Translate captions</button>
  <button id="restoreBtn">Restore original</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
